<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>DeepSeek 搜索</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    width: 400px;
    background: #0d1117;
    color: #e6edf3;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 13px;
  }
  header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border-bottom: 1px solid #30363d;
  }
  .brand { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 500; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #58a6ff; }
  .spacer { flex: 1; }
  .icon-btn {
    background: transparent;
    border: 1px solid #30363d;
    color: #8b949e;
    border-radius: 5px;
    padding: 4px 8px;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
  }
  .icon-btn:hover { color: #e6edf3; border-color: #484f58; }

  .main { padding: 12px; }
  #q {
    width: 100%;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 6px;
    color: #e6edf3;
    font-size: 14px;
    padding: 10px 12px;
    font-family: inherit;
    outline: none;
  }
  #q:focus { border-color: #58a6ff; }
  .row { display: flex; gap: 8px; margin-top: 8px; }
  #searchBtn {
    flex: 1;
    background: #58a6ff;
    border: none;
    color: #04121f;
    font-size: 13px;
    font-weight: 500;
    padding: 8px 0;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
  }
  #searchBtn:disabled { opacity: .5; cursor: not-allowed; }
  .tip { font-size: 11px; color: #6e7681; margin-top: 8px; line-height: 1.6; }
  .status { font-size: 11px; margin-top: 6px; color: #8b949e; }
  .status.warn { color: #d29922; }

  .settings {
    display: none;
    border-top: 1px solid #30363d;
    padding: 10px 12px 12px;
  }
  .settings.show { display: block; }
  .settings label { display: block; font-size: 11px; color: #8b949e; margin: 8px 0 4px; }
  .settings input[type="text"], .settings input[type="number"] {
    width: 100%;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 5px;
    color: #e6edf3;
    padding: 6px 8px;
    font-size: 12px;
    font-family: inherit;
    outline: none;
  }
  .settings input:focus { border-color: #58a6ff; }
  .settings .actions { display: flex; gap: 8px; margin-top: 10px; justify-content: flex-end; }
  .primary {
    background: #58a6ff;
    color: #04121f;
    border: none;
    border-radius: 5px;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
  }
  .hint { font-size: 10px; color: #6e7681; margin-top: 4px; line-height: 1.5; }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span>DeepSeek 搜索</div>
  <div class="spacer"></div>
  <button class="icon-btn" id="settingsBtn">设置</button>
</header>

<div class="main">
  <input id="q" type="text" placeholder="输入关键词，回车搜索" autofocus>
  <div class="row">
    <button id="searchBtn">搜索</button>
  </div>
  <div class="tip">回车后在新标签页以完整网页列出结果（支持 site: / lang: / after: 语法）</div>
  <div class="status" id="status"></div>
</div>

<div class="settings" id="settings">
  <label>DeepSeek API Key</label>
  <input type="text" id="cfgKey" placeholder="sk-...">
  <div class="hint">保存在扩展本地存储，仅用于调用 api.deepseek.com。</div>
  <label>单次请求条数（10–50，结果页每页显示 10 条）</label>
  <input type="number" id="cfgCount" min="10" max="50" value="30">
  <div class="actions">
    <button class="icon-btn" id="cancelBtn">关闭</button>
    <button class="primary" id="saveBtn">保存</button>
  </div>
</div>

<script src="popup.js"></script>
</body>
</html>
