<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepSeek 搜索</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --link: #6cb6ff;
    --visit: #b392f0;
    --ok: #3fb950;
    --err: #f85149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 14px;
  }
  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 0;
  }
  .topbar-inner {
    max-width: 980px;
    margin: 0 auto;
    padding: 0 20px;
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .brand {
    font-size: 17px;
    font-weight: 500;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--link); }
  .search-wrap { flex: 1; display: flex; gap: 8px; }
  #q {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 15px;
    padding: 10px 14px;
    font-family: inherit;
    outline: none;
  }
  #q:focus { border-color: var(--link); }
  #searchBtn {
    background: var(--link);
    border: none;
    color: #04121f;
    font-size: 14px;
    font-weight: 500;
    padding: 0 20px;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
  }
  #searchBtn:disabled { opacity: .5; cursor: not-allowed; }

  main { max-width: 980px; margin: 0 auto; padding: 18px 20px 60px; }
  .stats { font-size: 13px; color: var(--muted); margin-bottom: 16px; min-height: 18px; }
  .stats.error { color: var(--err); }

  .entry { margin-bottom: 26px; }
  .entry h2 {
    margin: 0 0 4px;
    font-size: 18px;
    font-weight: 400;
    line-height: 1.4;
  }
  .entry h2 a { color: var(--link); text-decoration: none; }
  .entry h2 a:hover { text-decoration: underline; }
  .entry h2 a:visited { color: var(--visit); }
  .url { font-size: 12px; color: var(--ok); margin-bottom: 6px; word-break: break-all; }
  .snippet { font-size: 14px; line-height: 1.75; color: #c9d1d9; word-break: break-word; margin-bottom: 6px; }
  .snippet mark { background: rgba(110,180,255,.22); color: #cfe6ff; padding: 0 1px; border-radius: 2px; }
  .entry-meta {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
  }
  .mini-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 11px;
    padding: 2px 9px;
    border-radius: 5px;
    cursor: pointer;
    font-family: inherit;
  }
  .mini-btn:hover { color: var(--text); border-color: #484f58; }
  .article {
    margin-top: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    font-size: 13px;
    line-height: 1.85;
    color: #c9d1d9;
    max-height: 360px;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .pager { display: flex; gap: 6px; justify-content: center; margin-top: 10px; }
  .pager button {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--muted);
    min-width: 34px;
    height: 34px;
    border-radius: 7px;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
  }
  .pager button.active { border-color: var(--link); color: var(--link); }
  .pager button:disabled { opacity: .4; cursor: not-allowed; }
  .empty { color: var(--muted); font-size: 14px; padding: 30px 0; text-align: center; }
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-inner">
    <div class="brand"><span class="dot"></span>DeepSeek 搜索</div>
    <div class="search-wrap">
      <input id="q" type="text" placeholder="输入关键词，支持 site: / lang: / after: 语法">
      <button id="searchBtn">搜索</button>
    </div>
  </div>
</div>

<main>
  <div class="stats" id="stats"></div>
  <div id="results"></div>
  <div class="pager" id="pager"></div>
</main>

<script src="search.js"></script>
</body>
</html>
